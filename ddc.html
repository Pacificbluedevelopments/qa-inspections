<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Sora – Design Due Diligence</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',Arial,sans-serif;background:#F5F4F1;color:#1A1A1A;}
.content{max-width:700px;margin:0 auto;background:#fff;min-height:100vh;}

/* HEADER */
.hdr{background:#123570;padding:0;}
.hdr-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:3px solid #97854A;}
.hdr-wm{background:#fff;padding:5px 12px;border-radius:5px;}
.hdr-wm img{height:20px;display:block;}
.hdr-right{text-align:right;color:rgba(255,255,255,.65);font-size:11px;line-height:1.8;}
.hdr-title{padding:14px 18px 16px;color:#fff;}
.hdr-title-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px;}
.hdr-title-main{font-size:20px;font-weight:700;color:#fff;}
.hdr-title-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px;}

/* PROJECT INFO */
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#E8EDF4;border-bottom:2px solid #97854A;}
.proj-cell{padding:10px 16px;border-right:1px solid #C5D0E0;border-bottom:1px solid #C5D0E0;}
.proj-cell:nth-child(even){border-right:none;}
.proj-label{font-size:10px;font-weight:600;color:#4E6895;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;}
.proj-val{font-size:13px;font-weight:600;color:#123570;}

/* SECTION HEADERS */
.sec-hdr{background:#123570;padding:10px 18px;margin-top:0;}
.sec-hdr-txt{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.1em;}
.sec-hdr-num{display:inline-block;background:#97854A;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;margin-right:8px;letter-spacing:.05em;}

/* ITEMS */
.item{border-bottom:1px solid #E8EDF4;padding:14px 18px;}
.item:nth-child(even){background:#FAFAF8;}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-left{flex:1;}
.item-name{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:3px;}
.item-desc{font-size:11px;color:#666;line-height:1.55;}
.item-note{font-size:12px;color:#333;background:#F0EDF8;padding:7px 10px;border-radius:5px;border-left:3px solid #4E6895;margin-top:8px;}
.item-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.item-photos img{width:100%;height:auto;border-radius:5px;border:1px solid #ddd;object-fit:cover;}
.badge{display:inline-block;font-weight:700;font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid;white-space:nowrap;flex-shrink:0;}
.badge-confirmed{background:#E8F0E8;color:#1E4D1E;border-color:#4A7C4A;}
.badge-pending{background:#FFF8E8;color:#7A5A00;border-color:#C8A000;}
.badge-na{background:#F0EDE8;color:#5A5550;border-color:#A09890;}
.badge-yes{background:#E8F0E8;color:#1E4D1E;border-color:#4A7C4A;}
.badge-no{background:#F5E8E5;color:#6B2318;border-color:#A84232;}
.badge-unknown{background:#F0EDE8;color:#5A5550;border-color:#A09890;}
.badge-default{background:#F0EDE8;color:#888;border-color:#ccc;}

/* PHOTO SECTION */
.photo-sec{padding:16px 18px;border-bottom:1px solid #E8EDF4;}
.photo-sec-label{font-size:12px;font-weight:600;color:#97854A;margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid #E8D8B8;}
.photo-block{border:2px dashed #C5D0E0;border-radius:8px;min-height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;background:#FAFAF8;}
.photo-block img{width:100%;height:auto;display:block;border-radius:6px;}
.photo-block-empty{font-size:11px;color:#BBBBBB;font-style:italic;padding:24px;}
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}

/* NOTES & SIGN-OFF */
.notes-block{padding:18px;}
.notes-label{font-size:11px;font-weight:700;color:#123570;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.notes-content{background:#F5F4F1;border-radius:6px;border:1px solid #E0DBCF;padding:12px;font-size:12px;color:#333;line-height:1.6;min-height:60px;}
.signoff{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 18px;}
.sig-line{border-top:1px solid #333;padding-top:6px;font-size:11px;color:#666;}

/* FOOTER */
.footer{padding:12px 18px 32px;font-size:10px;color:#9A9690;text-align:center;border-top:3px solid #97854A;}
.loading{text-align:center;padding:64px 16px;color:#9A9690;}
.spinner{width:32px;height:32px;border:3px solid #E4E0DA;border-top-color:#123570;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media print{body{background:#fff;}*{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
</style>
</head>

const SECTIONS = [
  { num:"1", title:"Site Documentation" },
  { num:"2", title:"Council & Planning Requirements" },
  { num:"3", title:"Environmental & Overlay Checks" },
  { num:"4", title:"Site Conditions & Orientation" },
  { num:"5", title:"Services & Infrastructure" },
  { num:"6", title:"General Notes" },
];

function getBadgeClass(val) {
  const v = (val||'').toLowerCase();
  if(v==='confirmed') return 'badge-confirmed';
  if(v==='pending') return 'badge-pending';
  if(v==='n/a'||v==='na') return 'badge-na';
  if(v==='yes'||v==='pass') return 'badge-yes';
  if(v==='no'||v==='fail') return 'badge-no';
  if(v==='unknown') return 'badge-unknown';
  return 'badge-default';
}

function cleanName(name) {
  return name.replace(/^\[\d+\]\s*/, '');
}

function getSectionNum(name) {
  const m = name.match(/^\[(\d+)\]/);
  return m ? m[1] : '0';
}

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job');
  const inspId = params.get('insp');
  if (!jobId || !inspId) {
    document.getElementById('report-content').innerHTML = '<div class="loading">No report specified.</div>';
    return;
  }
  try {
    const [jobDoc, inspDoc] = await Promise.all([
      db.collection('jobs').doc(jobId).get(),
      db.collection('jobs').doc(jobId).collection('inspections').doc(inspId).get()
    ]);
    if (!jobDoc.exists || !inspDoc.exists) {
      document.getElementById('report-content').innerHTML = '<div class="loading">Report not found.</div>';
      return;
    }
    const job = { id: jobDoc.id, ...jobDoc.data() };
    const insp = { id: inspDoc.id, ...inspDoc.data() };
    let items = [];
    if (insp.savedItems && insp.savedItems.length) {
      items = insp.savedItems.map(i => ({ name: i.name, desc: i.desc, num: i.num }));
    } else {
      const clDoc = await db.collection('checklists').doc(insp.checklistId).get();
      items = clDoc.exists ? clDoc.data().items.map((i,idx) => ({ name: i.name, desc: i.desc, num: String(idx+1) })) : [];
    }
    const results = insp.results || {};
    const notes = insp.notes || {};
    const photos = insp.photoURLs || insp.photos || {};

    document.title = 'Studio Sora – Design DDC – ' + job.address;

    // Group items by section
    const sections = {};
    items.forEach(item => {
      const s = getSectionNum(item.name);
      if (!sections[s]) sections[s] = [];
      sections[s].push(item);
    });

    // Build project info block
    const projHtml = `
      <div class="proj-grid">
        <div class="proj-cell"><div class="proj-label">Client</div><div class="proj-val">${job.client||'—'}</div></div>
        <div class="proj-cell"><div class="proj-label">Address</div><div class="proj-val">${job.address||'—'}</div></div>
        <div class="proj-cell"><div class="proj-label">Job number</div><div class="proj-val">${job.jobNumber||'—'}</div></div>
        <div class="proj-cell"><div class="proj-label">Date completed</div><div class="proj-val">${insp.date||'—'}</div></div>
        <div class="proj-cell" style="grid-column:1/-1"><div class="proj-label">Completed by</div><div class="proj-val">${insp.inspector||'—'}</div></div>
      </div>`;

    // Build section content
    let sectionsHtml = '';
    SECTIONS.forEach(sec => {
      const secItems = sections[sec.num] || [];
      if (!secItems.length && sec.num !== '6') return;

      sectionsHtml += `<div class="sec-hdr"><div class="sec-hdr-txt"><span class="sec-hdr-num">${sec.num}</span>${sec.title}</div></div>`;

      if (sec.num === '6') {
        // General notes
        const generalNote = notes['general'] || '';
        sectionsHtml += `<div class="notes-block"><div class="notes-content">${generalNote || '<span style="color:#ccc;font-style:italic;">No notes recorded</span>'}</div></div>`;
        return;
      }

      secItems.forEach((item, idx) => {
        const num = item.num || String(idx+1);
        const rawResult = results[num] || '—';
        const nt = notes[num] || '';
        const ph = (photos[num] || []).filter(Boolean);
        const displayName = cleanName(item.name);
        const desc = item.desc.replace(/\s*Status:.*$/, '').replace(/\s*Photograph required\.\s*/g,'').trim();
        const badgeClass = getBadgeClass(rawResult);
        let displayResult = rawResult;
        if(rawResult==='PASS') displayResult='Confirmed';
        if(rawResult==='FAIL') displayResult='Not Confirmed';
        if(rawResult==='NA') displayResult='N/A';

        sectionsHtml += `
          <div class="item">
            <div class="item-row">
              <div class="item-left">
                <div class="item-name">${displayName}</div>
                ${desc ? `<div class="item-desc">${desc}</div>` : ''}
              </div>
              <span class="badge ${badgeClass}">${displayResult}</span>
            </div>
            ${nt ? `<div class="item-note">${nt}</div>` : ''}
            ${ph.length ? `<div class="item-photos">${ph.map(s=>`<img src="${s}" loading="lazy">`).join('')}</div>` : ''}
          </div>`;
      });

      // Photo sections for 4 and 5
      if (sec.num === '4' || sec.num === '5') {
        const photoItems = secItems.filter(item => {
          const num = item.num;
          return (photos[num] || []).filter(Boolean).length > 0;
        });
        if (photoItems.length) {
          sectionsHtml += `<div class="photo-sec"><div class="photo-sec-label">Section ${sec.num} — Site Photographs</div>`;
          photoItems.forEach(item => {
            const num = item.num;
            const ph = (photos[num] || []).filter(Boolean);
            if (!ph.length) return;
            const displayName = cleanName(item.name);
            sectionsHtml += `<div style="margin-bottom:12px;"><div style="font-size:11px;font-weight:600;color:#4E6895;margin-bottom:6px;">${displayName}</div>`;
            if (ph.length === 1) {
              sectionsHtml += `<div class="photo-block"><img src="${ph[0]}"></div>`;
            } else {
              sectionsHtml += `<div class="photo-row">${ph.map(s=>`<div class="photo-block"><img src="${s}"></div>`).join('')}</div>`;
            }
            sectionsHtml += `</div>`;
          });
          sectionsHtml += `</div>`;
        }
      }
    });

    document.getElementById('report-content').innerHTML = `
      <div class="hdr">
        <div class="hdr-top">
          <div class="hdr-wm"><img src="${WM}" alt="Studio Sora"></div>
          <div class="hdr-right">Design Due Diligence Checklist<br>${insp.date||''}</div>
        </div>
        <div class="hdr-title">
          <div class="hdr-title-label">Studio Sora — Design Studio of Pacific Blue</div>
          <div class="hdr-title-main">Design Due Diligence</div>
          <div class="hdr-title-sub">${job.address||''}</div>
        </div>
      </div>
      ${projHtml}
      ${sectionsHtml}
      <div class="signoff">
        <div class="sig-line">Designer signature &amp; date</div>
        <div class="sig-line">Date completed</div>
      </div>
      <div class="footer">
        Studio Sora — Design Studio of Pacific Blue<br>
        hello@studiosora.com.au &nbsp;·&nbsp; studiosora.com.au
      </div>
    `;
  } catch(e) {
    document.getElementById('report-content').innerHTML = '<div class="loading">Error: ' + e.message + '</div>';
  }
}
loadReport();
</script>
